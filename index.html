<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameHub - My Game Collection</title>

    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ==========================================
         1. MAIN HEADER (Logo, Search, Theme Switch)
         ========================================== -->
    <header class="main-header">
      <!-- Brand Logo -->
      <div class="logo">
        <h1>GameHub</h1>
      </div>

      <!-- Live Search Bar -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search games..." />
      </div>

      <!-- Add new games -->
      <button id="add-game-btn" class="add-game-btn">
        <i class="fas fa-plus"></i> Add Game
      </button>

      <!-- Animated Theme Toggle Switch (Dark / Light) -->
      <label class="theme-switch" for="theme-toggle-input">
        <input type="checkbox" id="theme-toggle-input" />
        <span class="slider round">
          <i class="fas fa-sun icon-sun"></i>
          <i class="fas fa-moon icon-moon"></i>
        </span>
      </label>
    </header>

    <!-- ==========================================
         2. LAYOUT CONTAINER (Sidebar + Main Content)
         ========================================== -->
    <div class="layout-container">
      <!-- Sidebar Filters Area -->
      <aside class="sidebar">
        <h3>Filters</h3>

        <!-- Platform Filters Group -->
        <div class="filter-group">
          <h4>Platforms</h4>

          <!-- Primary Platforms Always Visible -->
          <button class="filter-btn active" data-platform="all">
            All Platforms
          </button>
          <button class="filter-btn" data-platform="pc">
            <i class="fas fa-desktop"></i> PC
          </button>
          <button class="filter-btn" data-platform="playstation">
            <i class="fab fa-playstation"></i> PlayStation
          </button>
          <button class="filter-btn" data-platform="xbox">
            <i class="fab fa-xbox"></i> Xbox
          </button>
          <button class="filter-btn" data-platform="nintendo">
            <i class="fas fa-gamepad"></i> Nintendo
          </button>

          <!-- Secondary Platforms Container (Hidden by Default) -->
          <div id="more-platforms" class="extra-platforms hidden">
            <button class="filter-btn" data-platform="ios">
              <i class="fab fa-apple"></i> iOS
            </button>
            <button class="filter-btn" data-platform="android">
              <i class="fab fa-android"></i> Android
            </button>
            <button class="filter-btn" data-platform="apple macintosh">
              <i class="fab fa-apple"></i> macOS
            </button>
            <button class="filter-btn" data-platform="linux">
              <i class="fab fa-linux"></i> Linux
            </button>
            <button class="filter-btn" data-platform="sega">
              <i class="fas fa-ghost"></i> SEGA
            </button>
            <button class="filter-btn" data-platform="atari">
              <i class="fas fa-gamepad"></i> Atari
            </button>
            <button class="filter-btn" data-platform="web">
              <i class="fas fa-globe"></i> Web
            </button>
          </div>

          <!-- Expandable Platform Dropdown Button -->
          <button id="toggle-platforms-btn" class="show-more-btn">
            <span>See more</span> <i class="fas fa-chevron-down"></i>
          </button>
        </div>

        <!-- Status / Progress Filters Group -->
        <div class="filter-group">
          <h4>Status</h4>
          <button class="filter-btn active" data-state="all">All</button>
          <button class="filter-btn" data-state="pending">
            <i class="fas fa-clock"></i> Plan to play
          </button>
          <button class="filter-btn" data-state="playing">
            <i class="fas fa-gamepad"></i> Playing
          </button>
          <button class="filter-btn" data-state="completed">
            <i class="fas fa-check-circle"></i> Completed
          </button>
          <button class="filter-btn" data-state="mastered">
            <i class="fas fa-trophy"></i> Mastered
          </button>
          <button class="filter-btn" data-state="abandoned">
            <i class="fas fa-times-circle"></i> Dropped
          </button>
        </div>
      </aside>

      <!-- Main Content Area (Dynamic Games Grid) -->
      <main class="content-area">
        <div class="content-header">
          <h2>My Game Collection <span id="game-count" class="count-badge">2</span></h2>
        </div>

        <!-- Dynamic Game Cards Injection Grid -->
        <section id="games-grid" class="games-grid">
          <!-- Game cards are dynamically rendered via app.js -->
        </section>

        <!-- Empty Collection Placeholder State (Hidden by default) -->
        <div id="empty-state" class="empty-state hidden">
          <i class="fas fa-folder-open empty-icon"></i>
          <h3>Your collection is empty</h3>
          <p>
            Start building your personal library by clicking the "Add Game"
            button above.
          </p>
        </div>
      </main>
    </div>

    <!-- ==========================================
         3. SEARCH & ADD GAME MODAL
         ========================================== -->
    <div id="add-game-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-search"></i> Add Game to Collection</h3>
          <button id="close-modal-btn" class="close-modal-btn">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="modal-search-box">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              id="modal-search-input"
              placeholder="Search for any game (e.g. Elden Ring, Zelda...)"
            />
          </div>

          <div id="modal-search-results" class="modal-search-results">
            <div class="modal-empty-hint">
              <i class="fas fa-gamepad"></i>
              <p>Type a title above to search from IGDB database.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
  </body>
</html>

    <!-- Application Script -->
    <script src="app.js"></script>
  </body>
</html>
