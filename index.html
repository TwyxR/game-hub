<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Colección Personal</title>
    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Link to CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Main header -->
    <header class="main-header">
      <div class="logo">
        <h1>Game Hub</h1>
      </div>

      <!-- Search bar -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search games..." />
      </div>

      <!-- Theme Toggle Switch -->
      <label class="theme-switch" for="theme-toggle-input">
        <input type="checkbox" id="theme-toggle-input" />
        <span class="slider round">
          <i class="fas fa-sun icon-sun"></i>
          <i class="fas fa-moon icon-moon"></i>
        </span>
      </label>
    </header>

    <!-- Main content (sidebar + grid) -->
    <div class="layout-container">
      <!-- Siderbar content (Filters)-->
      <aside class="sidebar">
        <h3>Filters</h3>

        <div class="filter-group">
          <h4>Platforms</h4>
          <button class="filter-btn active" data-platform="all">All</button>
          <button class="filter-btn" data-platform="pc">PC</button>
          <button class="filter-btn" data-platform="switch">
            Nintendo Switch
          </button>
          <button class="filter-btn" data-platform="playstation">
            PlayStation
          </button>
          <button class="filter-btn" data-platform="xbox-series-x-s">
            Xbox Series X/S
          </button>
        </div>

        <div class="filter-group">
          <h4>State</h4>
          <button class="filter-btn active" data-state="all">All</button>
          <button class="filter-btn" data-state="owned">Owned</button>
          <button class="filter-btn" data-state="wishlist">Wishlist</button>
        </div>
      </aside>

      <!-- Grid content (Gallery Games)-->
      <main class="content-area">
        <div class="content-header">
          <h2>My Game Collection <span id="game-count">0</span></h2>
        </div>

        <section id="games-grid" class="games-grid">
          <!-- Game cards will be dynamically inserted here -->
        </section>
      </main>
    </div>

    <!-- Link to JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
