<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameHub - My Game Collection</title>
    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Link to CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Main header -->
    <header class="main-header">
      <div class="logo">
        <h1>GameHub</h1>
      </div>

      <!-- Search bar -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search games..." />
      </div>

      <!-- Theme Toggle Switch -->
      <label class="theme-switch" for="theme-toggle-input">
        <input type="checkbox" id="theme-toggle-input" />
        <span class="slider round">
          <i class="fas fa-sun icon-sun"></i>
          <i class="fas fa-moon icon-moon"></i>
        </span>
      </label>
    </header>

    <!-- Main content (sidebar + grid) -->
    <div class="layout-container">
      <!-- Siderbar content (Filters)-->
      <aside class="sidebar">
        <h3>Filters</h3>

        <div class="filter-group">
        <h4>Platforms</h4>
  
        <!-- Platforms Always Visible -->
        <button class="filter-btn active" data-platform="all">All Platforms</button>
        <button class="filter-btn" data-platform="pc"><i class="fas fa-desktop"></i> PC</button>
        <button class="filter-btn" data-platform="playstation"><i class="fab fa-playstation"></i> PlayStation</button>
        <button class="filter-btn" data-platform="xbox"><i class="fab fa-xbox"></i> Xbox</button>
        <button class="filter-btn" data-platform="nintendo"><i class="fas fa-gamepad"></i> Nintendo</button>
  
        <!-- Extended Platforms Container (Hidden by Default) -->
        <div id="more-platforms" class="extra-platforms hidden">
        <button class="filter-btn" data-platform="ios"><i class="fab fa-apple"></i> iOS</button>
        <button class="filter-btn" data-platform="android"><i class="fab fa-android"></i> Android</button>
        <button class="filter-btn" data-platform="apple macintosh"><i class="fab fa-apple"></i> macOS</button>
        <button class="filter-btn" data-platform="linux"><i class="fab fa-linux"></i> Linux</button>
        <button class="filter-btn" data-platform="sega"><i class="fas fa-ghost"></i> SEGA</button>
        <button class="filter-btn" data-platform="atari"><i class="fas fa-gamepad"></i> Atari</button>
        <button class="filter-btn" data-platform="web"><i class="fas fa-globe"></i> Web</button>
    </div>

  <!-- Show More Toggle Button -->
  <button id="toggle-platforms-btn" class="show-more-btn">
    <span>See more</span> <i class="fas fa-chevron-down"></i>
  </button>
</div>

        <div class="filter-group">
          <h4>State</h4>
          <button class="filter-btn active" data-state="all">All</button>
          <button class="filter-btn" data-state="owned">Owned</button>
          <button class="filter-btn" data-state="wishlist">Wishlist</button>
        </div>
      </aside>

      <!-- Grid content (Gallery Games)-->
      <main class="content-area">
        <div class="content-header">
          <h2>My Game Collection <span id="game-count">0</span></h2>
        </div>

        <section id="games-grid" class="games-grid">
          <!-- Game cards will be dynamically inserted here -->
        </section>
      </main>
    </div>

    <!-- Link to JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
